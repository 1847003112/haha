<DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>父相子绝-头像在线标</title>
        <style>
            .father {
                position: relative;
                width: 500px;
                height: 200px;
                border: 1px solid #000;
                /* border-radius: 50%; */
                background: url("avatar.jpg");
                background-size: cover;
            }
            .badge {
                position: absolute;
                top: 5px;
                right: 20px;
                width: 50px;
                height: 30px;
                border: 50%;
                background: #f80404;
            }
            .text-center {
                position: absolute;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="father">
    <span class="text-left">商品卡片</span>
            <div class="badge">
                <span class="text-center">热销</span>
            </div>
        </div>
    </body>
</html>
